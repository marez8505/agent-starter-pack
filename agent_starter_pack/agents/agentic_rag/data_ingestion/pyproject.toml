[project]
name = "data-ingestion-pipeline"
version = "0.1.0"
description = "Data ingestion pipeline for RAG retriever"
readme = "README.md"
requires-python = ">=3.9, <=3.13"
dependencies = [
    "backoff>=2.2.1",
    "bigframes>=2.44.0",
    "docker>=7.1.0",
    "google-cloud-aiplatform>=1.158.0",
    "google-cloud-bigquery>=3.42.1",
    "google-cloud-pipeline-components>=2.22.0",
    "google-cloud-vectorsearch>=0.11.1",
    "kfp>=2.16.1",
    "langchain-text-splitters>=1.1.2",
    "markdownify>=1.2.2",
    "swifter>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_ingestion_pipeline"]